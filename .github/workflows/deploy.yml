name: Deploy to GitHub Pages

# Publishing is manual for now: the new News/People/Projects/Publications pages
# are finished but not signed off, and gh-pages is deliberately holding the
# older "under construction" page until they are.
#
# TO GO LIVE: uncomment the push trigger below and push to main (or just run
# this workflow by hand from the Actions tab, which publishes main as it
# stands).
#
# on:
#   push:
#     branches:
#       - main
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build site
        run: |
          pelican content -o output -s pelicanconf.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          force_orphan: false
          # Publish exactly what was built. This was previously true, which is
          # how a stale CNAME kept the site pointed at another domain long
          # after the setting that created it was gone: files that stop being
          # generated were never removed from the branch.
          keep_files: false
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy to GitHub Pages'
