{% extends "base.html" %}

{% block title %}{{ article.title }} &middot; {{ SITENAME }}{% endblock %}

{% block description %}{{ article.summary|striptags|truncate(160) }}{% endblock %}

{% block content %}
<article class="page post-page">
    <p class="post-back"><a href="{{ SITEURL }}/news.html">&larr; All news</a></p>

    <h1 class="page-title">{{ article.title }}</h1>
    <p class="post-meta">
        <time datetime="{{ article.date.strftime('%Y-%m-%d') }}">{{ article.locale_date }}</time>
    </p>

    <div class="content post-body">
        {{ article.content }}
    </div>
</article>
{% endblock %}
