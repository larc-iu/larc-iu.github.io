# Projects shown under "Projects" on the About page, in the order listed here.
# They have no page of their own; home.html renders them.
#
# Per project:
#   name       (required)  short, as you'd say it out loud
#   summary    (required)  a paragraph or two. Use a `|` block and separate
#                          paragraphs with a blank line -- home.html splits
#                          on those, so the YAML stays readable and there is no
#                          list of strings to maintain. Plain text, not Markdown.
#   image                  path under content/, e.g. images/projects/plaid.png.
#                          Rendered at 128px on the left of the entry -- small
#                          enough that a logo or app icon reads well; a wide
#                          screenshot will not. An entry with no image takes the
#                          full width instead of leaving a gap.
#   image_alt              alt text; defaults to the project name, which is
#                          only right when the image *is* the name (a logo).
#   image_width            optional, in px. Shrinks the picture below the 128px
#                          cap, for one that looks too heavy beside its
#                          neighbors (a full-bleed square, say).
#   years                  when the work ran, shown next to the name. Write
#                          plain hyphens; the template renders en dashes:
#                            "2025"       a single year
#                            "2023-2025"  a closed range
#                            "2025-"      ongoing since
#   links                  [{label, url}, ...] in the order you want them shown
#
# There is deliberately no per-project author field: the projects are the lab's,
# so repeating names on each one is noise. Credit belongs on the People page.

projects:
  - name: "Plaid"
    image: "images/projects/plaid.png"
    image_alt: "The Plaid logo"
    image_width: 115
    years: "2020-"
    summary: |
      Plaid is a platform for linguistic annotation applications focused on serving
      language documentation and allowing first-class integration with language technologies.
    links:
      - label: "Documentation"
        url: "https://larc-iu.github.io/plaid/"
      - label: "Code"
        url: "https://github.com/larc-iu/plaid"
  - name: "Low-Resource Model Evaluation"
    image: "images/projects/garo-newspaper.jpg"
    image_alt: "An old newspaper front page written in a language called Garo."
    years: "2024-"
    summary: |
      We have published several benchmarks designed to help us better understand
      how well language technologies, such as language models, can process low-resource languages.
    links:
      - label: "CoRSAL-OCR (2026)"
        url: "https://aclanthology.org/2026.computel-1.14/"
      - label: "PrOnto (2024)"
        url: "https://aclanthology.org/2024.lrec-main.1159/"
  - name: "Dipo"
    image: "images/projects/dipo.svg"
    image_alt: "The Dipo logo: a depot with a different discourse structure in each bay."
    years: "2026-"
    summary: |
      Dipo, the Discourse Parsing Omnibus (pronounced "depot"), is a collection of easy-to-use
      discourse parsers with pretrained models. It starts with Rhetorical Structure Theory and is
      built to take on other discourse frameworks.
    links:
      - label: "Code"
        url: "https://github.com/larc-iu/dipo"
